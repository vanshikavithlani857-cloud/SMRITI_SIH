<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Golden Glow for Heart -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Soft Caring Hands Gradient -->
    <linearGradient id="handGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.85" />
    </linearGradient>
    
    <linearGradient id="handGradRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.85" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner Subtle Border Accent -->
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background Decorative Concentric Waves (Symbol of Care & Harmony) -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3" />
  <circle cx="256" cy="240" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2.5" />
  <circle cx="256" cy="240" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Radiance Aura Behind Heart -->
  <circle cx="256" cy="225" r="75" fill="#fef08a" opacity="0.3" filter="url(#glow)" />

  <!-- The Golden Heart (Core Life, Devotion & Health) -->
  <path d="M 256 315
           C 256 315, 170 255, 170 195
           C 170 155, 205 130, 240 148
           C 250 153, 256 162, 256 162
           C 256 162, 262 153, 272 148
           C 307 130, 342 155, 342 195
           C 342 255, 256 315, 256 315 Z"
        fill="url(#heartGrad)" 
        filter="url(#glow)" />

  <!-- Inner Heart Highlight -->
  <path d="M 235 160
           C 215 152, 190 168, 190 192
           C 190 220, 225 258, 256 288
           C 251 282, 205 238, 205 195
           C 205 175, 222 163, 235 160 Z"
        fill="#ffffff" 
        opacity="0.45" />

  <!-- Left Supporting Hand (Gentle palm holding & safeguarding) -->
  <path d="M 120 375
           C 135 340, 165 315, 195 300
           C 215 290, 235 295, 245 312
           C 235 325, 215 330, 190 340
           C 165 350, 145 370, 135 395
           C 126 390, 122 382, 120 375 Z"
        fill="url(#handGradLeft)" />

  <!-- Right Supporting Hand (Gentle palm clasping in protective embrace) -->
  <path d="M 392 375
           C 377 340, 347 315, 317 300
           C 297 290, 277 295, 267 312
           C 277 325, 297 330, 322 340
           C 347 350, 367 370, 377 395
           C 386 390, 390 382, 392 375 Z"
        fill="url(#handGradRight)" />

  <!-- Supporting Base Stem (Lotus / Unity Pod) -->
  <path d="M 195 350
           C 225 385, 287 385, 317 350
           C 290 375, 222 375, 195 350 Z"
        fill="#ffffff"
        opacity="0.9" />

  <!-- Spark of Hope / Blessings Star -->
  <circle cx="256" cy="115" r="8" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="115" r="16" fill="#fef08a" opacity="0.4" filter="url(#glow)" />
</svg>
